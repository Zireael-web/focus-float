<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FocusFloat — Launcher Design Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#000000"/>
    <rect x="36" y="20" width="28" height="3.2" rx="1.6" fill="#f4f4f5"/>
    <rect x="30" y="40" width="40" height="2.4" rx="1.2" fill="#f4f4f5" opacity="0.85"/>
    <rect x="30" y="50" width="32" height="2.4" rx="1.2" fill="#f4f4f5" opacity="0.55"/>
    <rect x="30" y="60" width="36" height="2.4" rx="1.2" fill="#f4f4f5" opacity="0.55"/>
    <circle cx="71" cy="51" r="2.6" fill="none" stroke="#e26a5c" stroke-width="1.4"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="ff-tokens.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ff-components.jsx"></script>
<script type="text/babel" src="ff-screens-a.jsx"></script>
<script type="text/babel" src="ff-screens-b.jsx"></script>
<script type="text/babel" src="ff-docs.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const W = 412, H = 916;
// DCSection only recognises DIRECT <DCArtboard> children, so we spread shared
// props rather than wrapping in a helper component.
const PH = { width: W, height: H, style: { background: '#000', borderRadius: 2 } };

const S = window; // screen components live on window

function App() {
  return (
    <DesignCanvas>
      <DCSection id="foundations" title="Foundations" subtitle="Design tokens · component inventory — the contract for implementation">
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="col-amoled" label="Colors · AMOLED" width={300} height={560}><S.FFColorCard themeKey="amoled" /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="col-dark" label="Colors · Dark" width={300} height={560}><S.FFColorCard themeKey="dark" /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="col-light" label="Colors · Light" width={300} height={560}><S.FFColorCard themeKey="light" /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="type" label="Typography" width={330} height={640}><S.FFTypeCard /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="spacing" label="Spacing & radii" width={330} height={470}><S.FFSpacingCard /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="states" label="Row states" width={372} height={470}><S.FFStatesCard /></DCArtboard>
        <DCArtboard style={{ background: "#000", borderRadius: 2 }} id="inventory" label="Components" width={340} height={560}><S.FFInventoryCard /></DCArtboard>
      </DCSection>

      <DCSection id="home" title="Home" subtitle="The first screen after setup is a working launcher — not a landing page">
        <DCArtboard {...PH} id="home-ready" label="Ready"><S.HomeReady /></DCArtboard>
        <DCArtboard {...PH} id="home-paused" label="Category paused"><S.HomePaused /></DCArtboard>
        <DCArtboard {...PH} id="home-setup" label="Shizuku setup required"><S.HomeSetup /></DCArtboard>
        <DCArtboard {...PH} id="home-partial" label="Partial failure"><S.HomePartial /></DCArtboard>
      </DCSection>

      <DCSection id="apps" title="All Apps & Search" subtitle="Text-only by default · A–Z scrubber · search overlay states">
        <DCArtboard {...PH} id="all-apps" label="All apps"><S.AllApps /></DCArtboard>
        <DCArtboard {...PH} id="all-apps-states" label="All apps · row states"><S.AllAppsStates /></DCArtboard>
        <DCArtboard {...PH} id="all-apps-icons" label="All apps · icons on (optional)"><S.AllApps icons /></DCArtboard>
        <DCArtboard {...PH} id="search-results" label="Search · results"><S.SearchResults /></DCArtboard>
        <DCArtboard {...PH} id="search-empty" label="Search · empty"><S.SearchEmpty /></DCArtboard>
        <DCArtboard {...PH} id="search-none" label="Search · no results"><S.SearchNoResults /></DCArtboard>
      </DCSection>

      <DCSection id="sheets" title="Bottom Sheets" subtitle="Long-press actions · add to category · paused app">
        <DCArtboard {...PH} id="sheet-actions" label="App actions"><S.SheetAppActions /></DCArtboard>
        <DCArtboard {...PH} id="sheet-protected" label="App actions · protected"><S.SheetProtected /></DCArtboard>
        <DCArtboard {...PH} id="sheet-addcat" label="Add to category"><S.SheetAddCategory /></DCArtboard>
        <DCArtboard {...PH} id="sheet-paused" label="Paused app"><S.SheetPausedApp /></DCArtboard>
      </DCSection>

      <DCSection id="category" title="Pause Category" subtitle="Dopamine detail · ready / paused / setup / failed · error details">
        <DCArtboard {...PH} id="cat-ready" label="Ready"><S.CategoryReady /></DCArtboard>
        <DCArtboard {...PH} id="cat-paused" label="Paused"><S.CategoryPaused /></DCArtboard>
        <DCArtboard {...PH} id="cat-setup" label="Setup required"><S.CategorySetup /></DCArtboard>
        <DCArtboard {...PH} id="cat-failed" label="Failed to unpause"><S.CategoryFailed /></DCArtboard>
        <DCArtboard {...PH} id="cat-result" label="Pause result · error details"><S.PauseResult /></DCArtboard>
      </DCSection>

      <DCSection id="onboarding" title="Onboarding" subtitle="Welcome → Done · Shizuku status walkthrough">
        <DCArtboard {...PH} id="onb-welcome" label="Welcome"><S.OnbWelcome /></DCArtboard>
        <DCArtboard {...PH} id="onb-home" label="Set as home screen"><S.OnbHome /></DCArtboard>
        <DCArtboard {...PH} id="onb-favs" label="Pick favorites"><S.OnbFavorites /></DCArtboard>
        <DCArtboard {...PH} id="onb-cat" label="Create category"><S.OnbCategory /></DCArtboard>
        <DCArtboard {...PH} id="onb-addapps" label="Add apps"><S.OnbAddApps /></DCArtboard>
        <DCArtboard {...PH} id="onb-shz-1" label="Shizuku · not installed"><S.OnbShizuku status="notInstalled" /></DCArtboard>
        <DCArtboard {...PH} id="onb-shz-2" label="Shizuku · not running"><S.OnbShizuku status="notRunning" /></DCArtboard>
        <DCArtboard {...PH} id="onb-shz-3" label="Shizuku · permission"><S.OnbShizuku status="permission" /></DCArtboard>
        <DCArtboard {...PH} id="onb-shz-4" label="Shizuku · ready"><S.OnbShizuku status="ready" /></DCArtboard>
        <DCArtboard {...PH} id="onb-done" label="Done"><S.OnbDone /></DCArtboard>
      </DCSection>

      <DCSection id="settings" title="Settings" subtitle="Index · appearance · hidden · Shizuku · debug">
        <DCArtboard {...PH} id="set-index" label="Settings"><S.SettingsIndex /></DCArtboard>
        <DCArtboard {...PH} id="set-appearance" label="Appearance"><S.SettingsAppearance /></DCArtboard>
        <DCArtboard {...PH} id="set-hidden" label="Hidden apps"><S.SettingsHidden /></DCArtboard>
        <DCArtboard {...PH} id="set-shizuku" label="Shizuku status"><S.SettingsShizuku /></DCArtboard>
        <DCArtboard {...PH} id="set-debug" label="Debug"><S.SettingsDebug /></DCArtboard>
      </DCSection>

      <DCSection id="dialogs" title="Dialogs & Snackbar" subtitle="Small components">
        <DCArtboard {...PH} id="dlg-rename" label="Rename app"><S.DialogRename /></DCArtboard>
        <DCArtboard {...PH} id="dlg-renamecat" label="Rename category"><S.DialogRenameCat /></DCArtboard>
        <DCArtboard {...PH} id="dlg-createcat" label="Create category"><S.DialogCreateCat /></DCArtboard>
        <DCArtboard {...PH} id="dlg-unpause" label="Confirm unpause"><S.DialogConfirmUnpause /></DCArtboard>
        <DCArtboard {...PH} id="dlg-perm" label="Permission explanation"><S.DialogPermission /></DCArtboard>
        <DCArtboard {...PH} id="snackbar" label="Snackbar"><S.SnackbarDemo /></DCArtboard>
      </DCSection>

      <DCSection id="themes" title="Themes & Accessibility" subtitle="Same screens across AMOLED / Dark / Light + large font">
        <DCArtboard {...PH} id="th-amoled" label="Home · AMOLED"><S.HomeReady theme="amoled" /></DCArtboard>
        <DCArtboard {...PH} id="th-dark" label="Home · Dark"><S.HomeReady theme="dark" /></DCArtboard>
        <DCArtboard {...PH} id="th-light" label="Home · Light"><S.HomeReady theme="light" /></DCArtboard>
        <DCArtboard {...PH} id="th-apps-light" label="All apps · Light"><S.AllApps theme="light" /></DCArtboard>
        <DCArtboard {...PH} id="th-large" label="Home · Large font"><S.HomeReady theme="amoled" fontScale={1.3} /></DCArtboard>
        <DCArtboard {...PH} id="th-apps-large" label="All apps · Large font"><S.AllApps theme="amoled" fontScale={1.3} /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
